name: Feature request
description: Something you would like the app to do.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution. What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How you imagine it working in the app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you manage today?
      description: A workaround, another app, or a yt-dlp option you add under Extra arguments.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a request to get around a paywall, DRM, or a region or age restriction.
          required: true
